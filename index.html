<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --saffron: #E8A838;
    --turmeric: #D4912A;
    --terracotta: #C1553B;
    --deep-maroon: #6B1D2A;
    --cream: #FFF8F0;
    --warm-white: #FFFDF9;
    --card-bg: #FFFFFF;
    --text-primary: #2C1810;
    --text-secondary: #7A5C4F;
    --text-muted: #A8907A;
    --border: rgba(200,170,140,0.3);
    --shadow-soft: 0 4px 24px rgba(107,29,42,0.08);
    --shadow-hover: 0 12px 40px rgba(107,29,42,0.14);
    --radius: 16px;
    --radius-sm: 10px;
  }

  html { scroll-behavior: smooth }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Decorative background */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(232,168,56,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -300px;
    left: -200px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(193,85,59,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; }

  /* ─── Header ─── */
  header {
    text-align: center;
    padding: 48px 20px 12px;
    position: relative;
  }

  .brand-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--terracotta);
    background: rgba(193,85,59,0.08);
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 16px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.2rem);
    color: var(--deep-maroon);
    line-height: 1.15;
    margin-bottom: 8px;
  }

  header h1 em {
    color: var(--terracotta);
    font-style: italic;
    font-weight: 500;
  }

  header p {
    color: var(--text-secondary);
    font-size: 15px;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* ─── Shuffle Bar ─── */
  .shuffle-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 20px 8px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(to bottom, var(--cream) 60%, transparent);
    padding-bottom: 24px;
  }

  .btn-shuffle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    background: var(--deep-maroon);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 4px 16px rgba(107,29,42,0.25);
  }
  .btn-shuffle:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(107,29,42,0.35);
    background: #7d2233;
  }
  .btn-shuffle:active { transform: scale(0.97) }

  .btn-shuffle svg {
    width: 18px;
    height: 18px;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .btn-shuffle:hover svg { transform: rotate(180deg) }

  .btn-veg-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 14px 20px;
    background: var(--card-bg);
    border: 1.5px solid rgba(76,140,60,0.25);
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    color: #3d7a2e;
    cursor: default;
  }
  .veg-dot {
    width: 10px; height: 10px;
    border: 1.5px solid #3d7a2e;
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .veg-dot::after {
    content: '';
    width: 5px; height: 5px;
    background: #3d7a2e;
    border-radius: 50%;
  }

  /* ─── Grid ─── */
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 8px 16px 80px;
    max-width: 900px;
    margin: 0 auto;
  }

  @media (min-width: 540px) {
    .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 8px 24px 80px; }
  }
  @media (min-width: 820px) {
    .menu-grid { grid-template-columns: repeat(3, 1fr); }
    header { padding-top: 56px; }
  }
  @media (min-width: 1080px) {
    .menu-grid { grid-template-columns: repeat(4, 1fr); max-width: 1100px; }
  }

  /* ─── Card ─── */
  .day-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    opacity: 0;
    transform: translateY(24px);
  }
  .day-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .day-card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-4px);
  }
  .day-card.visible:hover {
    transform: translateY(-4px);
  }

  .card-img-wrap {
    position: relative;
    height: 180px;
    overflow: hidden;
    background: linear-gradient(135deg, #f0e0cc, #e8d5bc);
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.4s;
  }
  .day-card:hover .card-img-wrap img {
    transform: scale(1.06);
  }

  .card-img-wrap img.loading {
    opacity: 0.3;
  }

  .day-label {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--deep-maroon);
  }

  .btn-swap {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .btn-swap:hover {
    background: var(--saffron);
    transform: rotate(90deg);
  }
  .btn-swap:hover svg { stroke: #fff }
  .btn-swap svg {
    width: 16px;
    height: 16px;
    stroke: var(--text-secondary);
    stroke-width: 2;
    fill: none;
  }

  .prep-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .prep-badge svg {
    width: 12px; height: 12px;
    stroke: #fff; stroke-width: 2; fill: none;
  }

  .card-body {
    padding: 16px 16px 20px;
  }

  .dish-name {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
    line-height: 1.25;
  }

  .dish-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  /* ─── Swap animation ─── */
  .day-card.swapping .card-img-wrap img {
    opacity: 0;
    transform: scale(1.1);
  }
  .day-card.swapping .card-body {
    opacity: 0;
    transform: translateY(8px);
  }
  .card-body {
    transition: opacity 0.3s, transform 0.3s;
  }

  /* ─── Footer ─── */
  footer {
    text-align: center;
    padding: 0 20px 40px;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 6px }
  ::-webkit-scrollbar-track { background: transparent }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px }
</style>
</head>

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let currentMenu = [];
let usedIndices = new Set();

function pickRandom(exclude = new Set()) {
  const available = DISHES.map((_, i) => i).filter(i => !exclude.has(i));
  if (available.length === 0) {
    usedIndices.clear();
    return pickRandom(new Set());
  }
  const idx = available[Math.floor(Math.random() * available.length)];
  return idx;
}

function generateMenu() {
  usedIndices.clear();
  currentMenu = [];
  for (let i = 0; i < 7; i++) {
    const idx = pickRandom(usedIndices);
    usedIndices.add(idx);
    currentMenu.push(idx);
  }
}

function createCard(dayIndex) {
  const dish = DISHES[currentMenu[dayIndex]];
  const day = DAYS[dayIndex];
  const card = document.createElement('div');
  card.className = 'day-card';
  card.dataset.day = dayIndex;
  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${dish.img}" alt="${dish.name}" loading="lazy" onload="this.classList.remove('loading')" class="loading">
      <span class="day-label">${day}</span>
      <button class="btn-swap" onclick="swapDay(${dayIndex})" aria-label="Change ${day}'s dish">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
      </button>
      <div class="prep-badge">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        ${dish.prep}
      </div>
    </div>
    <div class="card-body">
      <div class="dish-name">${dish.name}</div>
      <div class="dish-desc">${dish.desc}</div>
    </div>
  `;
  return card;
}

function renderMenu() {
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const card = createCard(i);
    grid.appendChild(card);
    setTimeout(() => card.classList.add('visible'), 60 * i + 30);
  }
}

function shuffleAll() {
  const cards = document.querySelectorAll('.day-card');
  cards.forEach((c, i) => {
    c.style.transition = 'opacity 0.25s, transform 0.25s';
    c.style.opacity = '0';
    c.style.transform = 'translateY(16px) scale(0.97)';
  });
  setTimeout(() => {
    generateMenu();
    renderMenu();
  }, 300);
}

function swapDay(dayIndex) {
  const card = document.querySelector(`.day-card[data-day="${dayIndex}"]`);
  card.classList.add('swapping');

  setTimeout(() => {
    const excludeSet = new Set(currentMenu);
    const newIdx = pickRandom(excludeSet);
    usedIndices.delete(currentMenu[dayIndex]);
    currentMenu[dayIndex] = newIdx;
    usedIndices.add(newIdx);

    const newCard = createCard(dayIndex);
    newCard.classList.add('visible');
    card.replaceWith(newCard);
  }, 320);
}

// Init
generateMenu();
renderMenu();
</script>
